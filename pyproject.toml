[project]
name = "metasploit-mcp-bridge"
version = "0.1.0"
description = "Local stdio MCP bridge for the Metasploit MessagePack RPC API and console"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2,<3",
    "httpx>=0.28,<1",
    "msgpack>=1.1,<2",
    "psutil>=7.2,<8",
]

[project.scripts]
metasploit-mcp = "metasploit_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metasploit_mcp"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
